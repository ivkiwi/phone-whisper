name: Build APK

on:
  push:
  workflow_dispatch:

# A newer push supersedes an older run, so `build-<n>` releases are created in order.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools  # the default also asks for 'tools', which the SDK repo dropped

      - name: Fetch sherpa-onnx native libs (arm64-v8a)
        run: |
          set -euo pipefail
          VER=v1.13.2
          curl -fsSL -o sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/$VER/sherpa-onnx-$VER-android.tar.bz2"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          tar xjf sherpa.tar.bz2 \
            ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
            ./jniLibs/arm64-v8a/libonnxruntime.so
          cp jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
             jniLibs/arm64-v8a/libonnxruntime.so \
             app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-whisper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The in-app updater (AppUpdater.kt) installs the APK from the latest `build-<n>` release;
      # versionCode is the same run number (app/build.gradle.kts).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/debug/app-debug.apk phone-whisper.apk
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" phone-whisper.apk --clobber -R "$GITHUB_REPOSITORY"  # job re-run
          else
            gh release create "$tag" phone-whisper.apk -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Build $GITHUB_RUN_NUMBER" --latest \
              --notes "Debug APK built from $GITHUB_SHA."
          fi
