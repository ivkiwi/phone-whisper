name: Build APK

on:
  push:
  workflow_dispatch:

# A newer push supersedes an older run, so `build-<n>` releases are created in order.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools  # the default also asks for 'tools', which the SDK repo dropped

      - name: Fetch sherpa-onnx native libs (arm64-v8a)
        run: |
          set -euo pipefail
          VER=v1.13.2
          curl -fsSL -o sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/$VER/sherpa-onnx-$VER-android.tar.bz2"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          tar xjf sherpa.tar.bz2 \
            ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
            ./jniLibs/arm64-v8a/libonnxruntime.so
          cp jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
             jniLibs/arm64-v8a/libonnxruntime.so \
             app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-whisper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Separate job so only this step holds a write token: the debug signing key is public, so
  # whoever can publish a release can push an update to every install (AppUpdater.kt).
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phone-whisper-debug-apk

      - name: Publish release build-<run number> (versionCode, see app/build.gradle.kts)
        run: |
          set -euo pipefail
          tag="build-$GITHUB_RUN_NUMBER"
          mv app-debug.apk phone-whisper.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" phone-whisper.apk --clobber  # job re-run
            exit 0
          fi
          # A re-run of an old run must not move "latest" back below a newer build.
          newest=$(gh release list --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^build-[0-9]+$")) | ltrimstr("build-") | tonumber] | max // 0')
          latest=$([ "$GITHUB_RUN_NUMBER" -gt "$newest" ] && echo true || echo false)
          gh release create "$tag" phone-whisper.apk --target "$GITHUB_SHA" \
            --title "Build $GITHUB_RUN_NUMBER" --latest="$latest" \
            --notes "Debug APK built from $GITHUB_SHA."
