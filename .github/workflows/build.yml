name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch sherpa-onnx native libs (arm64-v8a)
        run: |
          set -euo pipefail
          VER=v1.13.2
          curl -fsSL -o sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/$VER/sherpa-onnx-$VER-android.tar.bz2"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          tar xjf sherpa.tar.bz2 \
            ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
            ./jniLibs/arm64-v8a/libonnxruntime.so
          cp jniLibs/arm64-v8a/libsherpa-onnx-jni.so \
             jniLibs/arm64-v8a/libonnxruntime.so \
             app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-whisper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
